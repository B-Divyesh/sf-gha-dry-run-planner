[package]
name = "gha-dry-run-planner"
version = "0.1.0"
edition = "2021"
description = "Explain which GitHub Actions workflows, jobs, and steps will run without executing them"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-gha-dry-run-planner"
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]
keywords = ["github-actions", "dry-run", "ci", "workflow"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ghaplan"
path = "src/lib.rs"

[[bin]]
name = "ghaplan"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.20"
